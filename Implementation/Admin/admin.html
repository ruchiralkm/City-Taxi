<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Sass/admin.min.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- title section -->
    <link rel="icon" href="../City-Taxi.png" type="image/x-icon" />
    <title>City-Taxi</title>
  </head>
  <body>
    <div class="wrapper">
      <div class="container main">
        <div class="row">
          <div class="col-md-6 side-image">
            <!-------------image------------->
            <img src="../City-Taxi.png" alt="" />
            <div class="text">
              <p style="font-size: 1.5rem">We are Making everyday better</p>
            </div>
          </div>

          <div class="col-md-6 right">
            <div class="input-box">
              <header>
                Administrator <br />
                Login
              </header>
              <div class="input-field">
                <input
                  type="text"
                  class="input"
                  id="email"
                  required=""
                  autocomplete="off"
                />
                <label for="email">Email</label>
              </div>
              <div class="input-field">
                <input type="password" class="input" id="pass" required="" />
                <label for="pass">Password</label>
              </div>
              <div class="input-field">
                <input type="submit" class="submit" value="Sign Up" />
              </div>
              <div class="signin">
                <span>&copy; 2024 City-Taxi(pvt). All rights reserved.</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
